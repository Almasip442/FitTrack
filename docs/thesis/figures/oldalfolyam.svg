<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="980" viewBox="0 0 1000 980" role="img" aria-labelledby="title desc"><title id="title">A fő felhasználói folyamat navigációja</title><desc id="desc">A nyilak egy bemutatási forgatókönyvet jelölnek; a főmenüből az oldalak külön is elérhetők. A naplózó és az elemző ablak komponensek, nem önálló URL-ek.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:bold}.body{font-size:18px}.note{font-size:14px}</style><text x="35" y="42" class="title">A fő felhasználói folyamat navigációja</text><path d="M245,185 L245,265" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M245,365 L245,445" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M245,545 L245,625" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M435,495 L540,495" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="445" y="480" class="note">menü</text><path d="M730,545 L730,625" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="740" y="585.0" class="note">menü</text><path d="M730,725 L730,805" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="55" y="85" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="113" text-anchor="middle" class="body">Regisztráció / bejelentkezés</text><rect x="55" y="265" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="293" text-anchor="middle" class="body">Hiányos profil: onboarding</text><text x="245" y="318" text-anchor="middle" class="body">Teljes profil: Dashboard</text><rect x="55" y="445" width="380" height="100