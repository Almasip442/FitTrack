<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc"><title id="title">Hozzáférésvédelem és titokkezelés</title><desc id="desc">A szerverellenőrzés és az RLS egymást kiegészítő védelmek. A service-role megkerülheti az RLS-t: csak megbízható szerver/seed környezetben használható. A diagram tervezett védelmi határokat mutat, nem helyettesíti a kétfiókos hozzáférési tesztet.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:bold}.body{font-size:18px}.note{font-size:14px}</style><text x="35" y="42" class="title">Hozzáférésvédelem és titokkezelés</text><path d="M245,185 L245,265" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M245,365 L245,445" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M245,545 L245,625" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M435,675 L540,675" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="55" y="85" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="113" text-anchor="middle" class="body">Böngésző</text><text x="245" y="138" text-anchor="middle" class="body">Supabase Auth munkamenet-cookie</text><rect x="55" y="265" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="293" text-anchor="middle" class="body">Next.js proxy / védett oldalak</text><text x="245" y="318" text-anchor="middle" class="body">Munkamenet és átirányítás</text><rect x="55" y="445" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="473" text-anchor="middle" class="body">Server Actions és API-k</text><text x="245" y="498" text-anchor="middle" class="body">Hitelesítés, bemenet, tulajdonos</text><rect x="55" y="625" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="653" text-anchor="middle" class="body">Supabase PostgreSQL RLS</text><text x="245" y="678" text-anchor="middle" class="body">Felhasználóhoz kötött sorok</text><rect x="540" y="85" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="113" text-anchor="middle" class="body">Nyilvános konfiguráció</text><text x="730" y="138" text-anchor="middle" class="body">Supabase URL és anon kulcs</text><rect x="540" y="265" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="293" text-anchor="middle" class="body">Szerveroldali OpenRouter-kulcs</text><text x="730" y="318" text-anchor="middle" class="body">Kizárólag szolgáltatói kéréshez</text><rect x="540" y="445" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="473" text-anchor="middle" class="body">Seed service-role kulcs</text><text x="730" y="498" text-anchor="middle" class="body">Emelt jog; nem kerül kliensbe</text><rect x="540" y="625" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="653" text-anchor="middle" class="body">Elkülönített felhasználói adatok</text><text x="730" y="678" text-anchor="middle" class="body">Másik felhasználó sora tiltott</text><text x="35" y="730" class="note">A szerverellenőrzés és az RLS egymást kiegészítő védelmek. A service-role megkerülheti az RLS-t: csak megbízható szerver/seed</text><text x="35" y="750" class="note">környezetben használható. A diagram tervezett védelmi határokat mutat, nem helyettesíti a kétfiókos hozzáférési tesztet.</text></svg>