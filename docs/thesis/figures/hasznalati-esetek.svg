<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title"><title id="title">FitTrack Pro – használati esetek</title><rect width="1100" height="850" fill="white"/><style>text{font-family:Arial,sans-serif;font-size:17px;fill:#172033}.head{font-size:25px;font-weight:bold}</style><text x="30" y="40" class="head">FitTrack Pro – használati esetek</text><rect x="150" y="80" width="790" height="670" rx="12" fill="#f8fafc" stroke="#64748b"/><text x="175" y="110">Alkalmazás és üzemeltetési műveletei</text><circle cx="65" cy="340" r="17" fill="white" stroke="#172033" stroke-width="2"/><path d="M65,357 v55 m-27,-35 h54 m-27,35 l-25,40 m25,-40 l25,40" fill="none" stroke="#172033" stroke-width="2"/><text x="65" y="475" text-anchor="middle">Felhasználó</text><circle cx="1020" cy="340" r="17" fill="white" stroke="#172033" stroke-width="2"/><path d="M1020,357 v55 m-27,-35 h54 m-27,35 l-25,40 m25,-40 l25,40" fill="none" stroke="#172033" stroke-width="2"/><text x="1020" y="475" text-anchor="middle">Üzemeltető</text><path d="M92,380 L195,165" stroke="#64748b" fill="none"/><ellipse cx="360" cy="165" rx="165" ry="31" fill="#eff6ff" stroke="#2563eb"/><text x="360" y="171" text-anchor="middle">HK-04: regisztráció és profil</text><path d="M92,380 L195,248" stroke="#64748b" fill="none"/><ellipse cx="360" cy="248" rx="165" ry="31" fill="#eff6ff" stroke="#2563eb"/><text x="360" y="254" text-anchor="middle">HK-05: edzésterv kezelése</text><path d="M92,380 L195,331" stroke="#64748b" fill="none"/><ellipse cx="360" cy="331" rx="165" ry="31" fill="#eff6ff" stroke="#2563eb"/><text x="360" y="337" text-anchor="middle">HK-02: edzés naplózása</text><path d="M92,380 L195,414" stroke="#64748b" fill="none"/><ellipse cx="360" cy="414" rx="165" ry="31" fill="#eff6ff" stroke="#2563eb"/><text x="360" y="420" text-anchor="middle">HK-06: étkezés rögzítése</text><path d="M92,380 L195,497" stroke="#64748b" fill="none"/><ellipse cx="360" cy="497" rx="165" ry="31" fill="#eff6ff" stroke="#2563eb"/><text x="360" y="503" text-anchor="middle">HK-07: testsúly rögzítése</text><path d="M92,380 L195,580" stroke="#64748b" fill="none"/><ellipse cx="360" cy="580" rx="165" ry="31" fill="#eff6ff" stroke="#2563eb"/><text x="360" y="586" text-anchor="middle">HK-01: heti áttekintés</text><path d="M92,380 L195,663" stroke="#64748b" fill="none"/><ellipse cx="360" cy="663" rx="165" ry="31" fill="#eff6ff" stroke="#2563eb"/><text x="360" y="669" text-anchor="middle">HK-03: elemzés és előzmény</text><path d="M993,380 L910,265" stroke="#64748b" fill="none"/><ellipse cx="750" cy="265" rx="160" ry="34" fill="#eff6ff" stroke="#2563eb"/><text x="750" y="271" text-anchor="middle">Konfiguráció</text><path d="M993,380 L910,395" stroke="#64748b" fill="none"/><ellipse cx="750" cy="395" rx="160" ry="34" fill="#eff6ff" stroke="#2563eb"/><text x="750" y="401" text-anchor="middle">Migráció és seed</text><path d="M993,380 L910,525" stroke="#64748b" fill="none"/><ellipse cx="750" cy="525" rx="160" ry="34" fill="#eff6ff" stroke="#2563eb"/><text x="750" y="531" text-anchor="middle">Telepítés, hibakeresés</text><text x="35" y="790">Az üzemeltetési műveletek CLI és szolgáltatói eszközök segítségével történnek.</text><text x="35" y="818">Az összekötések szereplő–használatieset kapcsolatot jelölnek, nem időbeli sorrendet.</text></svg>