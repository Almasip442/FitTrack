<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="980" viewBox="0 0 1000 980" role="img" aria-labelledby="title desc"><title id="title">A heti értékelés üzleti folyamata</title><desc id="desc">A bal oldali előkészítés után a jobb oldali OpenRouter-lépés következik. Hiányzó kulcs, timeout, szolgáltatóhiba vagy elutasított válasz esetén fallback készül. A mentés csak sikeres adatbázisművelet után tekinthető lezártnak.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:bold}.body{font-size:18px}.note{font-size:14px}</style><text x="35" y="42" class="title">A heti értékelés üzleti folyamata</text><path d="M245,185 L245,265" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M245,365 L245,445" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M245,545 L245,625" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M730,185 L730,265" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M730,365 L730,445" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M730,545 L730,625" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M730,725 L730,805" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="55" y="85" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="113" text-anchor="middle" class="body">Hitelesítés és heti korlát</text><text x="245" y="138" text-anchor="middle" class="body">401 / már létező elemzés: 429</text><rect x="55" y="265" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="293" text-anchor="middle" class="body">Aktuális hét és két előző hét</text><text x="245" y="318" text-anchor="middle" class="body">Profil, terv, naplók, testsúly</text><rect x="55" y="445" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="473" text-anchor="middle" class="body">Aggregáció és adatlefedettség</text><text x="245" y="498" text-anchor="middle" class="body">Hiányzó nap ≠ nulla bevitel</text><rect x="55" y="625" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="653" text-anchor="middle" class="body">Determinisztikus értékelés</text><text x="245" y="678" text-anchor="middle" class="body">Adaptív jelzés lezárt hetekből</text><rect x="540" y="85" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="113" text-anchor="middle" class="body">OpenRouter kérés</text><text x="730" y="138" text-anchor="middle" class="body">Strukturált adatok + szabályok</text><rect x="540" y="265" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="293" text-anchor="middle" class="body">Válasz ellenőrzése</text><text x="730" y="318" text-anchor="middle" class="body">JSON, mezők, pontszám, nyelv</text><rect x="540" y="445" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="473" text-anchor="middle" class="body">Érvényes: AI + szabályeredmény</text><text x="730" y="498" text-anchor="middle" class="body">Hiba: szabályalapú fallback</text><rect x="540" y="625" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="653" text-anchor="middle" class="body">Mentés: weekly_analyses</text><text x="730" y="678" text-anchor="middle" class="body">Snapshot + ai_status + eredmény</text><rect x="540" y="805" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="833" text-anchor="middle" class="body">Megjelenítés és visszaolvasás</text><text x="730" y="858" text-anchor="middle" class="body">Mentési hiba: 500, nincs siker</text><text x="35" y="910" class="note">A bal oldali előkészítés után a jobb oldali OpenRouter-lépés következik. Hiányzó kulcs, timeout, szolgáltatóhiba vagy</text><text x="35" y="930" class="note">elutasított válasz esetén fallback készül. A mentés csak sikeres adatbázisművelet után tekinthető lezártnak.</text><path d="M245,725 v25" stroke="#475569" stroke-width="2"/><circle cx="245" cy="770" r="18" fill="white" stroke="#475569"/><text x="245" y="776" text-anchor="middle" class="body">A</text><text x="540" y="73" class="note">A → az előkészítés folytatása</text></svg>