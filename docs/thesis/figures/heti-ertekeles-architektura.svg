<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">A FitTrack Pro heti értékelésének architektúrája</title>
  <desc id="desc">A böngésző a Next.js szerverhez fordul, amely a Supabase adatbázisból heti adatokat kér le, szabályalapú összegzést készít, és opcionálisan az OpenRouterhez küldi az összesített adatokat AI-magyarázatért.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#0b0d12}.box{fill:#151923;stroke:#525c70;stroke-width:2}.focus{stroke:#e11d48}.title{font:700 20px Arial,sans-serif;fill:#f8fafc}.sub{font:15px Arial,sans-serif;fill:#cbd5e1}.small{font:13px Arial,sans-serif;fill:#94a3b8}.arrow{fill:none;stroke:#94a3b8;stroke-width:2.5;marker-end:url(#arrow)}.optional{stroke-dasharray:8 6}
    </style>
  </defs>
  <rect class="bg" width="1120" height="470" rx="18"/>
  <rect class="box" x="30" y="160" width="190" height="145" rx="14"/>
  <text class="title" x="52" y="198">Böngésző</text>
  <text class="sub" x="52" y="231">Felhasználói felület</text>
  <text class="small" x="52" y="258">heti választó, naplók</text>
  <text class="small" x="52" y="280">elemzés megjelenítése</text>

  <rect class="box focus" x="310" y="95" width="365" height="280" rx="14"/>
  <text class="title" x="336" y="132">Next.js szerver</text>
  <rect class="box" x="336" y="153" width="310" height="62" rx="10"/>
  <text class="sub" x="354" y="180">Hitelesített oldalak és API-k</text>
  <text class="small" x="354" y="201">heti adatok lekérése, mentés</text>
  <rect class="box" x="336" y="231" width="310" height="62" rx="10"/>
  <text class="sub" x="354" y="258">Közös heti aggregáció</text>
  <text class="small" x="354" y="279">hiányzó napok, átlagok, volumen</text>
  <rect class="box" x="336" y="309" width="310" height="45" rx="10"/>
  <text class="sub" x="354" y="338">Szabályalapú értékelés + validálás</text>

  <rect class="box" x="790" y="85" width="285" height="150" rx="14"/>
  <text class="title" x="816" y="124">Supabase</text>
  <text class="sub" x="816" y="157">Auth + PostgreSQL</text>
  <text class="small" x="816" y="184">profil, terv, étkezés, edzés, súly</text>
  <text class="small" x="816" y="207">hozzáférésvédelem: RLS</text>
  <rect class="box" x="790" y="275" width="285" height="105" rx="14"/>
  <text class="title" x="816" y="314">OpenRouter</text>
  <text class="sub" x="816" y="344">opcionális AI-magyarázat</text>
  <text class="small" x="816" y="365">szerveroldali kulccsal</text>

  <path class="arrow" d="M220 232 H300"/>
  <path class="arrow" d="M675 178 H780"/>
  <text class="small" x="695" y="164">lekérés / mentés</text>
  <path class="arrow optional" d="M675 332 H780"/>
  <text class="small" x="692" y="318">összesített adatok</text>
  <path class="arrow optional" d="M790 360 C730 430 270 430 220 277"/>
  <text class="small" x="420" y="430">ellenőrzött magyarázat vagy szabályalapú fallback</text>
</svg>
