<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc"><title id="title">A napló és az elemzés életciklusa</title><desc id="desc">A naplóoldali állapotok üzleti fogalmak; nem egyetlen státuszoszlop enumértékei. Az aggregálás nem módosítja a naplót. A mentett napló később szerkeszthető. Sikertelen elemzésmentés után nincs új mentett rekord; újrapróbálás szükséges. A sample demóeredet nem élő AI-siker.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:bold}.body{font-size:18px}.note{font-size:14px}</style><text x="35" y="42" class="title">A napló és az elemzés életciklusa</text><path d="M245,185 L245,265" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M245,365 L245,445" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="255" y="405.0" class="note">mentés</text><path d="M245,545 L245,625" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M730,185 L730,265" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="740" y="225.0" class="note">kérés</text><path d="M730,365 L730,445" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="740" y="405.0" class="note">sikeres mentés</text><path d="M730,545 L730,625" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="55" y="85" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="113" text-anchor="middle" class="body">Tervezett edzés</text><text x="245" y="138" text-anchor="middle" class="body">Még nincs tényleges napló</text><rect x="55" y="265" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="293" text-anchor="middle" class="body">Szerkesztés a naplózóban</text><text x="245" y="318" text-anchor="middle" class="body">Részletes sorozatok / kihagyás</text><rect x="55" y="445" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="473" text-anchor="middle" class="body">Mentett napi napló</text><text x="245" y="498" text-anchor="middle" class="body">workout_completed és skipped</text><rect x="55" y="625" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="653" text-anchor="middle" class="body">Heti aggregáció bemenete</text><text x="245" y="678" text-anchor="middle" class="body">Kihagyott sor: nincs volumen</text><rect x="540" y="85" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="113" text-anchor="middle" class="body">Erre a hétre nincs elemzés</text><rect x="540" y="265" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="293" text-anchor="middle" class="body">Elemzés folyamatban</text><text x="730" y="318" text-anchor="middle" class="body">Metrikák és szabályeredmény</text><rect x="540" y="445" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="473" text-anchor="middle" class="body">Mentett elemzés</text><text x="730" y="498" text-anchor="middle" class="body">ai_status: success / fallback</text><rect x="540" y="625" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="653" text-anchor="middle" class="body">Előzményből megtekinthető</text><text x="730" y="678" text-anchor="middle" class="body">Új heti kérés: 429</text><text x="35" y="730" class="note">A naplóoldali állapotok üzleti fogalmak; nem egyetlen státuszoszlop enumértékei. Az aggregálás nem módosítja a naplót. A</text><text x="35" y="750" class="note">mentett napló később szerkeszthető. Sikertelen elemzésmentés után nincs új mentett rekord; újrapróbálás szükséges. A sample</text><text x="35" y="770" class="note">demóeredet nem élő AI-siker.</text></svg>