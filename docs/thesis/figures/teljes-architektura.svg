<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc"><title id="title">A FitTrack Pro komponenshatárai</title><desc id="desc">A Next.js szerver cookie-hoz kötött Supabase-klienssel olvas és ír; a seed külön szolgáltatási jogosultságot használ. A wger importforrás, nem a heti értékelés élő függősége. A webshop kiegészítő modul, a szakdolgozati fő folyamaton kívül.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#475569"/></marker></defs><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:bold}.body{font-size:18px}.note{font-size:14px}</style><text x="35" y="42" class="title">A FitTrack Pro komponenshatárai</text><path d="M245,185 L245,265" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M245,365 L245,445" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M435,315 L540,315" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="445" y="300" class="note">API</text><path d="M435,495 L540,495" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="445" y="480" class="note">API</text><path d="M435,675 L540,675" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="445" y="660" class="note">import</text><rect x="55" y="85" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="113" text-anchor="middle" class="body">Böngésző: React felület</text><text x="245" y="138" text-anchor="middle" class="body">Naplók, heti nézet, elemzés</text><rect x="55" y="265" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="293" text-anchor="middle" class="body">Next.js szerver</text><text x="245" y="318" text-anchor="middle" class="body">Proxy, Server Actions, API-k</text><rect x="55" y="445" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="473" text-anchor="middle" class="body">Heti aggregáció és szabálymotor</text><text x="245" y="498" text-anchor="middle" class="body">Validáció és hibakezelés</text><rect x="540" y="85" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="113" text-anchor="middle" class="body">Supabase Auth + PostgreSQL</text><text x="730" y="138" text-anchor="middle" class="body">Munkamenet, adatok, RLS</text><rect x="540" y="265" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="293" text-anchor="middle" class="body">Open Food Facts</text><text x="730" y="318" text-anchor="middle" class="body">Élelmiszerkeresés külső API</text><rect x="540" y="445" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="473" text-anchor="middle" class="body">OpenRouter → modell-szolgáltató</text><text x="730" y="498" text-anchor="middle" class="body">Heti magyarázat, opcionális</text><rect x="55" y="625" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="245" y="653" text-anchor="middle" class="body">Seed/import scriptek</text><text x="245" y="678" text-anchor="middle" class="body">Fejlesztői környezet</text><rect x="540" y="625" width="380" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="730" y="653" text-anchor="middle" class="body">wger gyakorlatkatalógus</text><text x="730" y="678" text-anchor="middle" class="body">Importált gyakorlatadatok</text><text x="35" y="730" class="note">A Next.js szerver cookie-hoz kötött Supabase-klienssel olvas és ír; a seed külön szolgáltatási jogosultságot használ. A wger</text><text x="35" y="750" class="note">importforrás, nem a heti értékelés élő függősége. A webshop kiegészítő modul, a szakdolgozati fő folyamaton kívül.</text><path d="M435,315 H480 V135 H540" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="450" y="210" class="note" transform="rotate(-90 450 210)">Auth / adat</text></svg>